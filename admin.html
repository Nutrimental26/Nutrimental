<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Panel privado · Nutrimental</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="adm">

<!-- Acceso -->
<div class="login" id="login">
  <div class="login-card">
    <img src="assets/logo.png" alt="Nutrimental">
    <h1>Panel privado</h1>
    <p>Solo para el L.N. Ingresa tu contraseña para editar paquetes, precios y promociones.</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" aria-label="Contraseña" required>
      <div class="err" id="loginErr" style="display:none;text-align:center">Contraseña incorrecta</div>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </div>
</div>

<!-- Panel -->
<div id="app" hidden>
  <header class="adm-top">
    <div class="wrap">
      <div class="brand"><img src="assets/icon.png" alt="" width="34" height="38"><span class="brand-txt"><b>PANEL NUTRIMENTAL</b><small>Edición de contenido</small></span></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <span class="dirty clean" id="dirty">Sin cambios</span>
        <button class="btn btn-sm btn-ghost" id="btnPreview">Vista previa</button>
        <button class="btn btn-sm btn-primary" id="btnDownload">Descargar config.js</button>
        <button class="btn btn-sm btn-ghost" id="btnLogout">Salir</button>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-bottom:60px">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="paquetes" aria-selected="true">Paquetes y precios</button>
      <button class="tab" role="tab" data-tab="promos" aria-selected="false">Promociones (imágenes)</button>
      <button class="tab" role="tab" data-tab="pago" aria-selected="false">Datos de depósito</button>
      <button class="tab" role="tab" data-tab="contacto" aria-selected="false">Contacto y envío</button>
      <button class="tab" role="tab" data-tab="seguridad" aria-selected="false">Contraseña</button>
      <button class="tab" role="tab" data-tab="publicar" aria-selected="false">Cómo publicar</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<script src="config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
